scientific_recomputation: none; descriptive cage means and the frozen CombZ standardisation
  reproduced exactly; no model. The standardised values are the stored canonical component
  z-scores exactly as they enter CombZ (the upstream within-sex CON standardisation
  is carried through verbatim, not re-derived from raw measures); CombZ is recomposed
  from them by the frozen rule of Analysis/build_later_outcome_combz.R and equals
  the stored CombZ within 1e-12. P1 / P1b / P1c are verbatim copies of the hash-gated
  post hoc run 29b (registry POSTHOC_CON_CONTRASTS v1.2), whose model was fitted there
  once; nothing is fitted, tested or adjusted in this bundle. D1 is a verbatim copy
  of the Stage 14 domain-heatmap source table and M1-M4 are the stored Stage 14 HMM
  figure tables of the corrected-outcome run promoted 2026-10-19 (display labels joined,
  a rank, the Wald interval from the stored estimate and SE, and dwell-time counts
  in fixed bins); no model is fitted, no test run, nothing smoothed and no p or q
  value produced here. E1 is a verbatim copy of Stage 09's sex-stratified correlation
  table (rho, p and BH q computed there); E2 / E2b / E2c are verbatim copies of the
  hash-gated post hoc run 29c (registry POSTHOC_MOVEMENT_COMBZ_FIT v1.2), whose display
  line and band were fitted there once; E3 is a verbatim copy of Stage 09's early-window
  coverage summary (slot counts, group-blind); E4 / E4b are verbatim copies of the
  hash-gated post hoc run 29d (registry POSTHOC_REPORTING_STATISTICS v1.0), where
  the t, df and per-sex Spearman intervals were computed once; T1 / T1b are ages by
  date arithmetic from the pinned planning workbook. Nothing is fitted here.
