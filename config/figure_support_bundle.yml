  figure tables of the run promoted 2026-10-06c (display labels joined, a rank, the
  Wald interval from the stored estimate and SE, and dwell-time counts in fixed bins);
  no model is fitted, no test run, nothing smoothed and no p or q value produced here.
  E1 is a verbatim copy of Stage 09's sex-stratified correlation table (rho, p and
  BH q computed there); E2 / E2b / E2c are verbatim copies of the hash-gated post
  hoc run 29c (registry POSTHOC_MOVEMENT_COMBZ_FIT v1.0), whose display line and band
  were fitted there once; T1 / T1b are ages by date arithmetic from the pinned planning
  workbook. Nothing is fitted here.
