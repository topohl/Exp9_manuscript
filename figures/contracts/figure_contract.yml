  # PROTEOMICS EXTENDED DATA, promoted in Phase 6A.
  #
  # Four of the seven v9 Extended Data figures were promotable. Each was audited
  # against the current frozen contracts by reading its source tables rather than
  # trusting the generation name, and each carries only provenance-level concerns.
  #
  # Three were NOT promoted and are deliberately absent from this contract:
  #   ED2  - panel c is presented as the complete canonical GO inventory and as
  #          the destination Figure 2h sends the reader to, but draws 14 of the
  #          2826 FDR-supported positive terms across 7 of 11 contrasts.
  #   ED4  - the WGCNA figure. Its phenotype panel annotates "0 of 45 module x
  #          contrast cells" with no compartment scope beside an all-compartment
  #          "0 of 35", and 45 is neuropil-only; and it labels 8 of 15 modules
  #          with a peak unit the canonical atlas declines to assign.
  #   ED7  - cited nowhere in the manuscript and supporting no recorded claim.
  # Their defects are recorded in provenance/claims/extended_data_promotion_audit.csv.
  # Nothing was substituted for them.

  ED_spatial_validation:
    title: Extended Data Figure 5
    width_mm: 183
    height_mm: 170
    layout_mode: absolute
    manuscript_role: proteomics_extended_data
    is_numbered_manuscript_figure: true
    extended_data_number: 5
    canonical_publication_id: extended_data_05
    canonical_generation: final_truth_v9
    canonical_generation_promoted_in_phase: "6A"
    historical_generation: ED1_FINAL_V9 + ED2_FINAL_V9 (panels a, b)
