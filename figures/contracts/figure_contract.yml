  # Results 2/3 claims, seven are supported by both generations, six by v9
  # alone and none by the retired grid generation, which had no bilateral
  # panel, no QC-aware DAP track and no GSEA exemplar curves. The three
  # technical blockers that held promotion back - column misregistration
  # between the DAP track and the atlas, a dependency on the superseded
  # export namespace, and a hard-coded eps-floor legend constant - were
  # repaired first and are guarded by tests.
