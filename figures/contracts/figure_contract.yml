        required_columns: [internal_contrast, external_signature, level, kind, expected_match, NES, signature_FDR]
        expected_rows: 30
        scientific_contract: external_contextual_anchoring_not_independent_validation
        biological_unit: animal
        hemisphere_handling: sample_level_model_blocked_by_AnimalID_and_adjusted_for_hemisphere
        significance_statistic: >-
          signature_FDR, Benjamini-Hochberg within the signature family. The
