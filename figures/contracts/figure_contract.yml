    assembled_pdf_source: results/figures/manuscript_candidates/final_truth_v9/extended_data/assembled/ED_SPATIAL_VALIDATION.pdf
    rendering_repository_computes_statistics: false
    question: >-
      How reproducible and how anatomically faithful are the spatial proteomes:
      the complete bilateral agreement and precision audit, the control-only
      spatial fingerprint and every tested pairing with an external signature.
      Extended Data 6 and 7 until 2026-10-20 (merged).
    withheld_panel: >-
      The historical panel c, v9_ed_internal_full, is deliberately not promoted.
      It drew 14 of 2,826 FDR-supported positive GO terms under a complete-
      inventory caption. No manuscript claim cites it.
    panels:
      - id: 05a
        reader: "Agreement between hemispheres: every stored bilateral metric of every control-only anatomical contrast"
        v9_panel_id: v9_ed_bilateral_full
        description: >-
          complete stored bilateral metric inventory; main 2f shows only the
