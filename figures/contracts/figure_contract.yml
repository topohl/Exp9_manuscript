  # rather than reworded, and the two artefacts that carried the same claim were
  # corrected with it: the Figure 2h pointer now names the released
  # control_anatomical_go_bp_gsea supplementary table, and ST3 states its
  # selection instead of claiming completeness.
  #
  # Panel b needed a repair of its own before it could be promoted, and it is the
  # panel the manuscript actually cites. It marked significance from the column
  # named p_adjust and its legend called that Benjamini-Hochberg adjusted. In
  # this analysis p_adjust is the raw single-set value, so that was the same
  # class of false statistical label that withheld panel c - on the study's only
  # externally anchored claim. It now uses signature_FDR, the signature-family
  # correction the Results sentence actually rests on, and its released source
  # data carries both statistics under their true names. No mark moved: the two
  # agree on all 30 rows.
