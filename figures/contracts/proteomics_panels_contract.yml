    phenotype_axes: RES-CON+SUS-CON+SUS-RES
    main_or_ed: ed_deepens
    narrative: detailed curve with set size, leading-edge counts and reconstruction provenance.
    primary_source: null
    # the theme table (the three-contrast strip) stays first; the curve is the
    # frozen Figure 3 export of the same exemplar (f9_frozen_curve)
    input_dependencies:
      - results/tables/10_biological_integration/gsea_wgcna_concordance/global/ontology_aware_gsea_theme_assignments_all_contrasts.csv
      - source_data/pRoteomics/figure_03_adaptation/selection.csv
      - source_data/pRoteomics/figure_03_adaptation/running_enrichment_curves.csv
  - id: v9_ed_gsea_curve_rna
    renderer: f9_ed_gsea_curve
    role: gsea_support_detailed
    program_key: rna
    spatial_axes: region
    phenotype_axes: RES-CON+SUS-CON+SUS-RES
    main_or_ed: ed_deepens
    narrative: detailed curve, soma CA2-SP.
    primary_source: null
    input_dependencies:
      - results/tables/10_biological_integration/gsea_wgcna_concordance/global/ontology_aware_gsea_theme_assignments_all_contrasts.csv
      - source_data/pRoteomics/figure_03_adaptation/selection.csv
      - source_data/pRoteomics/figure_03_adaptation/running_enrichment_curves.csv
  - id: v9_ed_gsea_curve_ox
    renderer: f9_ed_gsea_curve
    role: gsea_support_detailed
    program_key: oxphos
    spatial_axes: region
    phenotype_axes: RES-CON+SUS-CON+SUS-RES
    main_or_ed: ed_deepens
    narrative: detailed curve, microglia-enriched CA1.
    primary_source: null
    input_dependencies:
      - results/tables/10_biological_integration/gsea_wgcna_concordance/global/ontology_aware_gsea_theme_assignments_all_contrasts.csv
      - source_data/pRoteomics/figure_03_adaptation/selection.csv
      - source_data/pRoteomics/figure_03_adaptation/running_enrichment_curves.csv
  - id: v9_ed_atlas_rescon
    renderer: f9_gsea_atlas
    label_units: 4.6
    role: gsea_support_three_contrast_pattern
    contrast: RES - CON
    spatial_axes: compartment+region+layer
    phenotype_axes: RES-CON
    main_or_ed: ed_unique
    narrative: the RES vs CON atlas; main Figure 3b shows SUS vs RES.
    primary_source: results/tables/10_biological_integration/gsea_wgcna_concordance/global/ontology_aware_gsea_theme_assignments_all_contrasts.csv
  - id: v9_ed_atlas_suscon
    renderer: f9_gsea_atlas
    label_units: 4.6
    role: gsea_support_three_contrast_pattern
    contrast: SUS - CON
    spatial_axes: compartment+region+layer
    phenotype_axes: SUS-CON
    main_or_ed: ed_unique
    narrative: the SUS vs CON atlas, completing the set of three pairwise contrasts.
    primary_source: results/tables/10_biological_integration/gsea_wgcna_concordance/global/ontology_aware_gsea_theme_assignments_all_contrasts.csv
  - id: v9_ed_identity
    renderer: f9_ed_identity_subsets
    role: stress_identity_robustness
    spatial_axes: region+layer
    phenotype_axes: SUS-RES
    main_or_ed: ed_unique
    narrative: the outside-control-affinity result across every robustness subset.
    primary_source: results/tables/11_spatial_systems/ca2_slm_robustness/stress_identity_robustness_comparison.csv
  - id: v9_ed_locations
    renderer: f9_ed_locations
    role: control_affinity_vs_phenotype_effect_location
    spatial_axes: compartment+region+layer
    phenotype_axes: SUS-RES
    main_or_ed: ed_unique
    narrative: dominant unit in control animals versus the location of the strongest SUS-RES effect.
    primary_source: results/tables/11_spatial_systems/atlas/protein_spatial_cell_affinity.csv
  - id: v9_ed_similarity
    renderer: f9_ed_similarity
    role: what_a_spatial_network_is
    spatial_axes: compartment+region+layer
    phenotype_axes: none_intentional
    main_or_ed: ed_unique
    narrative: >-
      CON molecular-similarity matrices with facet width proportional to unit
      count; that this is not connectivity is stated in the legend.
    primary_source: results/tables/11_spatial_systems/networks/CON_spatial_molecular_similarity_matrix.csv
  - id: v9_ed_network_distance
    renderer: s5_ed_network_distance
    role: network_replicates
    spatial_axes: compartment
    phenotype_axes: CON+RES+SUS
    main_or_ed: ed_unique
    narrative: >-
      animal-level network distance from the CON consensus, with each
      compartment's exact whole-network permutation p printed in its facet.
    primary_source: results/tables/11_spatial_systems/networks/animal_network_distance_from_CON.csv
    input_dependencies:
      - results/tables/11_spatial_systems/networks/network_global_multivariate_test.csv
  - id: v9_ed_nulls
    renderer: f9_ed_nulls
    role: network_null
    spatial_axes: compartment
    phenotype_axes: CON+RES+SUS
    main_or_ed: ed_unique
    narrative: exact whole-network permutation against its attainable floor.
    primary_source: results/tables/11_spatial_systems/networks/network_global_multivariate_test.csv
  - id: v9_ed_coupling
    renderer: f9_ed_coupling
    role: coupling_null
    spatial_axes: region+layer
    phenotype_axes: none_applicable
    main_or_ed: ed_unique
    narrative: every distinct edge-behaviour correlation; an underpowered null.
    primary_source: results/tables/08_behavior_physio_coupling/network_behavior_coupling/edge_behavior_correlations_fdr_all_tests.csv
