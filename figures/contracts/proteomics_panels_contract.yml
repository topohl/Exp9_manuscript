    primary_source: results/source_data/spatial_validation/map_anatomical_programmes/anatomical_programme_display_terms.csv

  - id: v9_input_territories
    renderer: hf_input_territories
    role: input_territory_organisation
    spatial_axes: region+layer
    phenotype_axes: none_intentional
    main_or_ed: main_unique
    groups: [CON]
    narrative: >-
      laminae that share an input territory are more alike across subfields, relative to
      same-region laminae, in their presynaptic proteins than for abundance-matched random
