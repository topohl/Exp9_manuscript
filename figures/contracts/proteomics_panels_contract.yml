    primary_source: results/source_data/spatial_validation/map_input_territories/input_territory_scores_by_animal.csv
    input_dependencies:
      - results/source_data/spatial_validation/map_input_territories/input_territory_tests.csv
      - results/source_data/spatial_validation/map_input_territories/input_territory_sensitivity.csv
      - results/source_data/spatial_validation/map_input_territories/input_territory_protein_contrasts.csv

  - id: v9_afferent_sources
    renderer: hf_afferent_sources
    role: afferent_source_location
    spatial_axes: region+layer
    phenotype_axes: none_intentional
    main_or_ed: main_unique
    groups: [CON]
    narrative: >-
      proteins whose mRNA is enriched in entorhinal, CA3 or granule cells are higher in the
      perforant-path, Schaffer-collateral or mossy-fibre lamina than in the neighbouring
      lamina of the same region (whole-mouse-brain single-cell reference of other animals);
      control animals.
    primary_source: results/source_data/spatial_validation/map_afferent_sources/afferent_source_scores_by_animal.csv
    input_dependencies:
      - results/source_data/spatial_validation/map_afferent_sources/afferent_source_contrasts.csv
      - results/source_data/spatial_validation/map_afferent_sources/afferent_source_sets.csv

  - id: v9_inhibitory_share
    renderer: hf_inhibitory_share
    role: laminar_synapse_composition
    spatial_axes: region+layer
    phenotype_axes: none_intentional
    main_or_ed: main_unique
    groups: [CON]
    narrative: >-
      the inhibitory presynaptic share (GAD1, GAD2 and VGAT relative to VGLUT1) of every
      lamina, control animals; the strata within each region and the same stratum across
