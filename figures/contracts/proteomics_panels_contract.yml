  - id: v9_go_ca2
    renderer: hf_programme_dots
    families: [CA2_strata]
    family_labels: [CA2 neuropil]
    selection: curated
    role: functional_characterization
    spatial_axes: region+layer
    phenotype_axes: none_intentional
    main_or_ed: main_unique
    narrative: >-
      GO biological-process programmes of the CA2 neuropil strata (contrasts added
