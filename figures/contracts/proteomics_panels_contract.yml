    primary_source: results/source_data/spatial_validation/compare_lamina_synapses/inhibitory_share_by_animal.csv
    input_dependencies:
      - results/source_data/spatial_validation/compare_lamina_synapses/inhibitory_share_contrasts.csv

  # ===================== FIGURE 3 =========================================
