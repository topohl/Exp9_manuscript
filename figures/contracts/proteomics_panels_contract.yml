# Editorial v8: final editorial polish and vector export freeze.
#
# The scientific architecture is FIXED as of Part 23. Nothing here reopens
# differential abundance, GSEA inference, WGCNA, spatial networks, robustness
# definitions, feature selection, biological interpretation or panel
# membership. This layer changes only how the settled evidence is drawn.
#
# Canonical and Parts 16-23 are frozen. Outputs live under
# results/**/manuscript_candidates/final_truth_v9/**.
#
# Four rules govern this layer and are enforced by the build and its tests:
#   1. FONT FLOOR. No text below 5 pt at final size.
#   2. MAIN/ED HIERARCHY. A main panel and an Extended Data panel must never be
#      the same graphic at two sizes. Main = concise and story-driving.
#      ED = complete audit, more information, not merely more millimetres.
#   3. ONE SCALE PER QUANTITY. Where the same quantity is plotted in more than
#      one panel it carries one shared symmetric scale and one colour bar.
#      Since palette v3.2 that scale is the measure's fixed colour limit
#      (config/manuscript_palette.yml diverging_limits: NES, z, set-mean z,
#      correlation, SMD), drawn by hv_diverging(measure = ...): values beyond
#      it take full colour, the colour bar ends read <= / >=, and the source
#      data keep every value uncapped.
#   4. VECTOR EXPORT. The delivered PDF must contain embedded fonts and real
#      text-showing operators and must contain no page-sized raster.
#
# Every spatial panel uses config/manuscript_spatial_order.yml: neuropil carries
# region x layer, soma and the microglia-enriched ROI are region-level only.

contract_version: manuscript_final_truth_v9_figures_v2_adaptation
status: promoted_canonical_manuscript_figures_2_and_3
# Promoted in Phase 5B. Figures 2 and 3 of the manuscript are this generation.
# figures/contracts/figure_contract.yml declares them and is the manuscript-facing
# contract; this file remains the producing contract and keeps the renderer
# and panel provenance. The Extended Data figures in this contract are NOT
# promoted and remain candidates.
palette: config/manuscript_palette.yml
spatial_order: config/manuscript_spatial_order.yml
font_floor_pt: 5

panels:

  # ===================== FIGURE 2 =========================================
  - id: v9_depth
    renderer: f9_depth_compact
    role: technical_context
    spatial_axes: compartment
    phenotype_axes: none_intentional
    main_or_ed: main_concise
    narrative: all three compartments have sufficient coverage for spatial comparison.
    # PB-02: canonical acquisition workbook, not the v2 export copy.
    primary_source: data/raw/pg_matrix/quicksearch.stats.annotated.xlsx

  - id: v9_pca
    renderer: hf_pca_compact
    role: global_structure
    spatial_axes: compartment+region
    phenotype_axes: none_intentional
    main_or_ed: main_unique
    narrative: >-
      the global proteome is broadly organised before any specific spatial
      signature is inspected. Simplified for the main figure: no sample labels,
      deterministic legend order, compartment encoded clearly, no empty legend
      block and no boundary clipping.
    # PB-02: canonical joint-QC PCA scores, not the v2 export copy.
    primary_source: results/tables/03_qc_exploration/00b_joint_compartment_qc/global/joint_primary_pca_scores.csv
    input_dependencies:
      - results/tables/03_qc_exploration/00b_joint_compartment_qc/global/joint_primary_pca_variance_explained.csv

  - id: v9_fingerprint
    renderer: f9_fingerprint
    role: direct_control_spatial_molecular_view
    spatial_axes: compartment+region+layer
    phenotype_axes: none_intentional
    main_or_ed: main_concise
    narrative: >-
      the largest panel in Figure 2. Phenotype-blind genes selected only by
      prespecified CON-only anatomical contrasts, shown as within-protein
      standardised CON abundance across every spatial unit.
    primary_source: results/tables/manuscript_candidates/spatial_v6/figure2_spatial_fingerprint_proteins.csv

  - id: v9_compartment
    renderer: f9_compartment
    role: compartment_identity
    spatial_axes: compartment
    phenotype_axes: none_intentional
    main_or_ed: ed_unique
    narrative: >-
      neuropil, neuronal soma and the microglia-enriched ROI carry distinct
      expected molecular identities (Extended Data since 2026-10-28; Figure 2d
      shows every class marker).
    primary_source: results/source_data/03_qc_exploration/04e_control_compartment_abundance_publication_figures/global/figure2d_compact_recognizable_markers_v2_source_data.csv

  - id: v9_external_main
    renderer: f9_external_main
    role: external_anatomical_validation
    spatial_axes: region+layer
    phenotype_axes: none_intentional
    main_or_ed: main_concise
    narrative: >-
      do internally observed spatial identities agree with an external
      hippocampal reference? Story-driving expected pairings only, blocked by
      anatomical level. The complete specificity inventory lives in Extended Data 5d.
    primary_source: results/source_data/04_differential_expression_enrichment/control_spatial_identity_validation/global/figure2e_source_data.csv

  # ----- Figure 2 re-layout of 2026-10-27: the author's hand-drawn schematic,
  # reference marker classes in every acquisition, and GO programmes of regions
  # and layers (selection and statistics from pRoteomics map_anatomical_programmes)
  - id: v9_schematic_space_f2
    renderer: hf_schematic_space
    role: hand_drawn_schematic_placeholder
    spatial_axes: compartment+region+layer
    phenotype_axes: none_intentional
    main_or_ed: main_unique
    narrative: the space for the sampling workflow schematic, drawn by hand.
    primary_source: null

  - id: v9_marker_classes
    renderer: hf_marker_classes
    role: compartment_identity
    spatial_axes: compartment
    phenotype_axes: none_intentional
    main_or_ed: main_unique
    groups: [CON]
    narrative: >-
      reference marker classes (Allen cell types; GO, MGI; SynGO) are most abundant
      in the compartment they mark, in every acquisition of the control animals, on
      the joint cross-compartment scale; compartments compared on the animal means.
    primary_source: results/source_data/spatial_validation/score_compartment_markers/marker_class_scores_by_acquisition.csv
    input_dependencies:
      - results/source_data/spatial_validation/score_compartment_markers/marker_class_scores_by_animal.csv
      - results/source_data/spatial_validation/score_compartment_markers/marker_class_compartment_contrasts.csv

  - id: v9_go_soma
    renderer: hf_programme_dots
    families: [soma_regions]
    family_labels: [Soma]
    selection: curated
    role: functional_characterization
    spatial_axes: region
    phenotype_axes: none_intentional
    main_or_ed: main_unique
    narrative: >-
      GO biological-process programmes of the four soma regions, each term shown
      in every region; control animals only. Functional annotation of the same
      data, not validation.
    primary_source: results/source_data/spatial_validation/map_anatomical_programmes/anatomical_programme_display_terms.csv

  - id: v9_go_ca1
