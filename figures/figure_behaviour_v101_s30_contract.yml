# Candidate figure contract: behaviour generation behaviour_v101_s30.
#
# THIS IS NOT THE MANUSCRIPT CONTRACT. figures/figure_contract.yml remains the
# sole authority for the numbered figures. Nothing here promotes, replaces or
# overwrites a canonical figure (figures/main/*, Figures 1-3 in results/figures/
# manuscript/), and the whole candidate generation can be deleted without
# affecting the canonical pipeline. No candidate key is registered in
# provenance/publication_registry/.
#
# Rendering only. Every panel plots stored values of the two pinned bundles,
# read through R/behaviour_bundle.R and R/stage30_bundle.R: the Stage 29 v1.0.1
# behaviour bundle (ebb) and the Stage 30 figure bundle (s30b). Every printed
# number resolves through the annotation map to exactly one stored cell
# (bundle_cell). Nothing is fitted, tested, adjusted or summarised here.
#
# Entry point: figures/behaviour_v101_s30_candidates.R renders every panel at its
# box, assembles each candidate in absolute layout (8-pt bold lowercase letters
# drawn by manuscript_figure_assemble_svg), writes the 300-dpi PNG and raster PDF
# (manuscript_figure_raster_companions), the per-panel source data, the panel and
# input manifests, a run manifest per candidate and the generation receipt.
#
# Per panel:
#   id                 file stem suffix of the panel SVG (<candidate>_<id>.svg)
#   letter             the letter the assembler draws ("" = none: single-panel pages)
#   builder            the panel-library function (R/panels/behaviour_*.R) that draws it
#   args               the builder's layout arguments (no values: every number is in the map)
#   jitter_seed        explicit seed(s) of the presentational jitter (null: no jitter)
#   inputs             bundle tables the panel reads, including the tables behind its
#                      annotation keys (the entry script stops if the builder reads others)
#   annotation_panels  map panels whose keys this panel prints (value-for-value tested)
#   annotation_panels_plotted  map panels whose keys it resolves only to place marks
#   annotation_panels_legend   map panels whose keys the panel's draft legend or the draft Results
#                      text quotes; the entry script resolves them into the panel's source data
#                      with src_role "legend" (they are not drawn on this panel)
#   x, y, w, h         the absolute box in mm; the panel SVG is authored at w x h (scale 1)
#
# Layout arguments shared by several builders:
#   top_margin_pt      the panel's top margin; letterless single-panel pages pass 3 (the 11.5-pt
#                      default leaves room for a panel letter)
#   panel_top_mm, panel_h_mm   absolute top and height of the first plot panel, so two boxes of
#                      one row share one panel frame (ED X d/e)
#   typography: candidate      CANDIDATE_SPEC A typography in the reused Figure 1 builders (en-dash
#                      ranges, U+2212 exponent, "RES − SUS" / "Female − male" labels); the
#                      canonical Figure 1 keeps its own strings
#   compact_header     no patchwork outer margin, so the title sits under the letter
#   title_position: plot   titles start at the plot edge (one anchor per row or page)
#   scatter_width      relative width of the prediction scatter (Figure 1f: 0.6)
#
# Boxes follow CANDIDATE_SPEC C; departures are recorded under `layout_notes`.

contract_version: behaviour_v101_s30_candidates_v1
generation: behaviour_v101_s30
status: candidate_only_not_promoted
canonical_contract: figures/figure_contract.yml
entry_point: figures/behaviour_v101_s30_candidates.R
annotation_map: figures/behaviour_v101_s30_annotation_map.csv
